<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-label="遊撃手の位置から打球のEPへ向かう2つの入り方。旧来は右側へ弧を描いて大回り、体修塾は比較的まっすぐ入る">
  <!-- ball path -->
  <line x1="60" y1="300" x2="230" y2="70" stroke="#94a3b8" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <circle cx="60" cy="300" r="7" fill="#e2e8f0"/>
  <text x="76" y="306" fill="#94a3b8" font-size="13">打球</text>
  <!-- EP -->
  <circle cx="200" cy="110" r="11" fill="none" stroke="#f6c90e" stroke-width="3"/>
  <text x="150" y="104" fill="#f6c90e" font-size="15" font-weight="800">EP</text>
  <!-- fielder -->
  <circle cx="430" cy="60" r="12" fill="#d4af37"/>
  <text x="400" y="34" fill="#e2e8f0" font-size="13">守備位置</text>
  <!-- arc path (traditional) -->
  <path d="M430 60 C 420 200, 300 210, 215 120" stroke="#64748b" stroke-width="4" fill="none" stroke-dasharray="10 8" stroke-linecap="round"/>
  <!-- straight path -->
  <path d="M430 60 L218 106" stroke="#f6c90e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M218 106 L234 96 M218 106 L232 116" stroke="#f6c90e" stroke-width="5" stroke-linecap="round"/>
  <text x="232" y="66" fill="#f6c90e" font-size="13" font-weight="800">体修塾：比較的まっすぐ</text>
  <text x="300" y="210" fill="#94a3b8" font-size="13">旧来：右側へ弧を描く</text>
</svg>