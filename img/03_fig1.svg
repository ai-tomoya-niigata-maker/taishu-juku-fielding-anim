<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" role="img" aria-label="右足で着地し、すねが左に傾く。地面からの力がすねに沿って左上へ向かう図">
  <line x1="10" y1="160" x2="190" y2="160" stroke="#334155" stroke-width="3"/>
  <!-- foot -->
  <path d="M120 160 L150 160 L150 152 L128 150 Z" fill="#94a3b8"/>
  <!-- shin tilted left -->
  <line x1="132" y1="152" x2="98" y2="88" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
  <!-- thigh -->
  <line x1="98" y1="88" x2="116" y2="34" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <!-- angle arc -->
  <path d="M132 120 A32 32 0 0 0 117 124" stroke="#d4af37" stroke-width="2" fill="none"/>
  <line x1="132" y1="152" x2="132" y2="104" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- force vector -->
  <line x1="140" y1="166" x2="62" y2="18" stroke="#f6c90e" stroke-width="4" stroke-linecap="round" opacity=".0"/>
  <path d="M120 150 L58 34" stroke="#f6c90e" stroke-width="4" stroke-linecap="round"/>
  <path d="M58 34 L58 52 M58 34 L72 44" stroke="#f6c90e" stroke-width="4" stroke-linecap="round"/>
  <text x="20" y="182" fill="#94a3b8" font-size="12">← 打球の方向（左）</text>
  <text x="140" y="110" fill="#d4af37" font-size="12">シンアングル</text>
  <text x="20" y="30" fill="#f6c90e" font-size="12" font-weight="700">力の向き</text>
</svg>