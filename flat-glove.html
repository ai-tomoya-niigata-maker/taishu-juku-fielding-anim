<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動く図｜板グラブドリル｜体修塾ゴロ捕球の教科書</title>
<style>
  :root{
    --bg:#0d1b2a; --bg2:#0a0e1a; --card:#111827; --border:#1e3a5f;
    --gold:#d4af37; --gold2:#f6c90e; --text:#f8fafc; --body:#e2e8f0; --sub:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(180deg,var(--bg2),var(--bg));color:var(--body);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;line-height:1.8;min-height:100vh}
  .wrap{max-width:960px;margin:0 auto;padding:28px 16px 60px}
  .label{font-size:12px;letter-spacing:.3em;color:var(--gold);font-weight:800;text-align:center}
  h1{text-align:center;font-size:clamp(22px,4.6vw,30px);font-weight:900;color:var(--text);margin:4px 0}
  .lead{text-align:center;color:var(--sub);font-size:14px;margin-bottom:16px}

  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .tab{font:inherit;cursor:pointer;border-radius:12px;padding:10px 6px;text-align:center;background:var(--card);border:1px solid var(--border);border-top:4px solid var(--gold);color:var(--sub);font-weight:800}
  .tab.on{background:color-mix(in srgb,var(--gold) 22%,var(--card));box-shadow:0 0 0 2px var(--gold) inset;color:#fff}
  .tabs.three{grid-template-columns:1fr 1fr 1fr}
  .tab:disabled{opacity:.4;cursor:not-allowed}

  .info{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .info > div{background:var(--card);border-radius:12px;padding:10px 12px;border-top:3px solid var(--gold)}
  .info .k{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:800}
  .info .v{font-size:14px;font-weight:800;color:var(--text);line-height:1.5}

  .caption{min-height:56px;margin:0 0 12px;padding:12px 18px;border-radius:14px;background:var(--card);border-left:5px solid var(--gold)}
  .caption .txt{font-size:clamp(16px,3.4vw,19px);font-weight:900;color:var(--text);line-height:1.5}

  .count{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-bottom:12px}
  .dots{display:flex;gap:6px;align-items:center}
  .dots i{width:16px;height:16px;border-radius:50%;border:2px solid #475569;display:inline-block}
  .dots i.done{background:#fff;border-color:#fff}
  .dots i.now{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(246,201,14,.35)}
  .cnt{font-weight:900;color:var(--text);font-size:15px}
  .tempo{flex:1;min-width:180px}
  .tempo .k{font-size:11px;color:var(--sub);letter-spacing:.12em}
  .bar{height:8px;border-radius:4px;background:#1e293b;overflow:hidden}
  .bar b{display:block;height:100%;background:linear-gradient(90deg,#64748b,var(--gold2));width:0}

  .stage{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}
  .panel{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:10px 10px 6px}
  .panel .pt{font-size:12px;letter-spacing:.16em;color:var(--sub);font-weight:700;padding:2px 6px 6px}
  .panel svg{display:block;width:100%;height:auto}
  .legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:12.5px;color:var(--sub);margin-top:8px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:14px}
  .group{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px 8px;flex-wrap:wrap}
  .group span{font-size:12px;color:var(--sub);padding:0 4px;letter-spacing:.08em}
  button.b{font:inherit;font-size:14px;font-weight:800;color:var(--text);background:#0b1424;border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer}
  button.b.on{background:var(--gold);color:#0a0e1a;border-color:var(--gold)}
  button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
  @media (max-width:720px){ .stage{grid-template-columns:1fr} .info{grid-template-columns:1fr 1fr} }
  html.embed body{min-height:0}
  html.embed .wrap{padding-top:8px;padding-bottom:12px}
  html.embed .wrap > .label, html.embed .wrap > h1, html.embed .wrap > .lead{display:none}
  html.shot .controls, html.shot .wrap > .label, html.shot .wrap > h1, html.shot .wrap > .lead{display:none}
  html.shot .wrap{padding:10px 12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="label">MOVING FIGURE｜FLAT GLOVE DRILL</div>
  <h1>板グラブドリル</h1>
  <p class="lead">第2章の最後。板グラブ（パンケーキタイプ）で、両足の真ん中のゴロをダブルで捕る（このドリルだけ）。右手はグラブの近くに置き、ヒッティングスイッチ。（右投げ）</p>

  <div class="tabs">
    <button class="tab on" data-pos="kneel">両膝つき（パラレル）</button>
    <button class="tab" data-pos="chu">レベルアップ｜中腰（パラレル）</button>
  </div>

  <div class="info">
    <div><div class="k">ねらい</div><div class="v" id="iAim">-</div></div>
    <div><div class="k">形</div><div class="v" id="iForm">-</div></div>
    <div><div class="k">ボール</div><div class="v" id="iBall">-</div></div>
    <div><div class="k">回数</div><div class="v">10球連続。初心者は<br>ゆっくり、上級者は速く</div></div>
  </div>

  <div class="caption" aria-live="polite"><div class="txt" id="capTxt">-</div></div>

  <div class="count">
    <div class="dots" id="dots"></div>
    <div class="cnt" id="cnt">1 / 10球</div>
    <div class="tempo"><div class="k">トスの間隔（10球とも同じ）</div><div class="cnt" id="tempoTxt">ゆっくり｜初心者</div></div>
  </div>

  <div class="stage">
    <div class="panel"><div class="pt">横から見た図（トスの軌道）</div><svg id="side" viewBox="0 40 600 245" role="img" aria-label="横から見たトスの軌道と姿勢"></svg></div>
    <div class="panel"><div class="pt">前から見た図（トサーの位置から）</div><svg id="front" viewBox="20 105 320 245" role="img" aria-label="前から見た姿勢とスイッチ"></svg></div>
  </div>
  <div class="legend">
    <span><i style="background:#ef4444"></i>右足</span><span><i style="background:#3b82f6"></i>左足</span>
    <span><i style="background:#8b5a2b"></i>グラブ</span><span><i style="background:#ffffff;border:1px solid #94a3b8"></i>ボール</span>
    <span><i style="background:#f6c90e"></i>右手（スイッチの位置）</span><span><i style="background:#c08a4e"></i>土手（グラブの手首側）</span>
  </div>

  <div class="controls">
    <div class="group"><button class="b" id="btnPlay">❚❚ 一時停止</button><button class="b" id="btnRestart">↺ 最初から</button></div>
    <div class="group"><span>グラブ</span><button class="b on" data-gl="push">push（出しながら）</button><button class="b" data-gl="pull">pull（引きながら）</button></div>
    <div class="group"><span>トスの間隔</span><button class="b on" data-lv="beg">ゆっくり（初心者）</button><button class="b" data-lv="adv">速い（上級者）</button></div>
    <div class="group"><span>再生</span><button class="b on" data-sp="1">ふつう</button><button class="b" data-sp="0.4">スロー</button></div>
  </div>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  const seg = (u, a, b) => clamp((u - a) / (b - a), 0, 1);
  const lp = (A, B, k) => ({ x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k) });
  const arc = (A, B, h, k) => ({ x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k) - 4 * h * k * (1 - k) });
  const COL = { shirt: "#1e3a5f", shirt2: "#274b78", pants: "#d6dde6", skin: "#e2b48a", cap: "#14284a", glove: "#8b5a2b", L: "#3b82f6", R: "#ef4444", tosser: "#475569" };
  const limb = (g, a, b, w, color, cap = "round") => el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: color, "stroke-width": w, "stroke-linecap": cap }, g);

  // one trial, normalized time u (0..1)
  const U = { rel: .14, b1: .28, b2: .67, meet: .72, sw0: .78, sw1: .88, drop: .97 };
  const N = 10, FINISH = 1.8;
  let level = "beg", gl = "push", zone = 3, pos = "kneel", md = "d3";
  const dbl = () => md === "d3";
  const dur = n => level === "beg" ? 2.9 : 1.5;          // beginner: all slow / advanced: all fast

  // ---------- SIDE VIEW ----------
  const side = $("side");
  el("rect", { x: 0, y: 0, width: 600, height: 300, fill: "#0e1a12" }, side);
  el("rect", { x: 0, y: 230, width: 600, height: 70, fill: "#2a1f14" }, side);
  const sPath = el("path", { fill: "none", stroke: "rgba(226,232,240,.35)", "stroke-width": 2, "stroke-dasharray": "3 7" }, side);
  const B1 = { x: 140, y: 230 }, B2 = { x: 418, y: 230 }, R0 = { x: 106, y: 210 }, SM = { x: 434, y: 221 };
  const bMark = (p, txt, sub) => {
    el("ellipse", { cx: p.x, cy: p.y + 2, rx: 12, ry: 4, fill: "none", stroke: "#f6c90e", "stroke-width": 2 }, side);
    const t = el("text", { x: p.x, y: p.y + 22, fill: "#f6c90e", "font-size": 13, "font-weight": 900, "text-anchor": "middle" }, side); t.textContent = txt;
    const s = el("text", { x: p.x, y: p.y + 38, fill: "#cbd5e1", "font-size": 11.5, "font-weight": 700, "text-anchor": "middle" }, side); s.textContent = sub;
    return s;
  };
  bMark(B1, "1バウンド目", "トサーのすぐ横"); const b2Sub = bMark(B2, "2バウンド目", "フォア側へ");
  sPath.setAttribute("d", (() => { let d = `M${R0.x} ${R0.y}`; for (let i = 1; i <= 10; i++) { const p = arc(R0, B1, 4, i / 10); d += ` L${p.x} ${p.y}`; } for (let i = 1; i <= 30; i++) { const p = arc(B1, B2, 26, i / 30); d += ` L${p.x} ${p.y}`; } for (let i = 1; i <= 10; i++) { const p = arc(B2, SM, 2, i / 10); d += ` L${p.x} ${p.y}`; } return d; })());
  const sTosser = el("g", {}, side);
  const sPlayer = el("g", {}, side);
  const sBalls = [0, 1].map(() => { const g = el("g", {}, side); el("circle", { r: 8, fill: "#fff", stroke: "#64748b", "stroke-width": 2 }, g); el("path", { d: "M-5 -4 Q0 0 -5 4 M5 -4 Q0 0 5 4", stroke: "#e11d48", "stroke-width": 1.6, fill: "none" }, g); return g; });
  const sSpin = el("g", { opacity: 0 }, side);
  el("path", { d: "M-14 -6 A15 15 0 0 1 10 -12", fill: "none", stroke: "#f6c90e", "stroke-width": 2.5 }, sSpin);
  el("path", { d: "M10 -12 l-7 -2 l3 7 z", fill: "#f6c90e" }, sSpin);
  const sSpinT = el("text", { x: 0, y: -22, fill: "#f6c90e", "font-size": 12, "font-weight": 900, "text-anchor": "middle" }, sSpin); sSpinT.textContent = "トップスピン";
  const sBasketBalls = el("g", {}, side);

  function drawTosser(u) {
    const g = sTosser; while (g.firstChild) g.removeChild(g.firstChild);
    const hip = { x: 78, y: 170 }, sh = { x: 86, y: 118 }, head = { x: 92, y: 98 };
    limb(g, hip, { x: 92, y: 200 }, 13, COL.tosser); limb(g, { x: 92, y: 200 }, { x: 86, y: 230 }, 11, COL.tosser);
    limb(g, hip, { x: 66, y: 200 }, 13, "#3f4b5b"); limb(g, { x: 66, y: 200 }, { x: 60, y: 230 }, 11, "#3f4b5b");
    limb(g, hip, sh, 18, COL.tosser);
    el("circle", { cx: head.x, cy: head.y, r: 12, fill: "#94a3b8" }, g);
    // underhand swing: back -> release
    const k = ease(seg(u, 0, U.rel)), back = { x: 58, y: 182 };
    const hand = u < U.rel ? lp(back, R0, k) : lp(R0, { x: 120, y: 160 }, ease(seg(u, U.rel, U.rel + .12)));
    limb(g, sh, hand, 9, COL.tosser);
    const t = el("text", { x: 78, y: 252, fill: "#94a3b8", "font-size": 13, "font-weight": 800, "text-anchor": "middle" }, g); t.textContent = "トサー";
  }

  // player side view (facing left = toward the tosser). right side toward camera.
  // legs: { hip, knee, foot, col, kneel }  (kneel: knee on the ground, shin back along the ground)
  const KN = { hip: { x: 520, y: 172 }, sh: { x: 498, y: 118 }, head: { x: 486, y: 96 },
              far: { knee: { x: 514, y: 228 }, foot: { x: 566, y: 230 }, col: COL.L, kneel: true }, near: { knee: { x: 522, y: 228 }, foot: { x: 574, y: 230 }, col: COL.R, kneel: true } };
  const CH = { hip: { x: 530, y: 146 }, sh: { x: 490, y: 100 }, head: { x: 474, y: 82 },
              far: { knee: { x: 486, y: 182 }, foot: { x: 502, y: 230 }, col: COL.L }, near: { knee: { x: 490, y: 184 }, foot: { x: 508, y: 230 }, col: COL.R } };
  const SPOSE = {
    kneel3: { ...KN, hand: { x: 500, y: 196 }, elbR: { x: 492, y: 156 } }, kneel4: { ...KN, hand: { x: 500, y: 196 }, elbR: { x: 492, y: 156 } },
    chu3: { ...CH, hand: { x: 482, y: 176 }, elbR: { x: 488, y: 138 } }, chu4: { ...CH, hand: { x: 482, y: 176 }, elbR: { x: 488, y: 138 } },
  };
  const SBASKET = { x: 548, y: 200 };
  const sPose = () => SPOSE[pos + zone];
  let sGlove = { x: 460, y: 216 };
  let sHandOv = null, fHandOv = null;
  const sHand = () => sHandOv ? sHandOv : dbl() ? { x: sGlove.x + 9, y: sGlove.y - 6 } : sPose().hand;
  function drawPlayerSide(glove, gOpen) {
    const g = sPlayer; while (g.firstChild) g.removeChild(g.firstChild);
    sGlove = glove;
    const P = { ...sPose(), hand: sHand() }, z4 = zone === 4;
    if (dbl()) P.elbR = { x: lerp(P.sh.x, P.hand.x, .45) + 10, y: lerp(P.sh.y, P.hand.y, .5) + 6 };
    const leg = (L, pants, w) => {
      limb(g, P.hip, L.knee, w, pants); limb(g, L.knee, L.foot, w - 6, pants);
      if (L.kneel) el("circle", { cx: L.knee.x, cy: L.knee.y - 2, r: 9.5, fill: L.col }, g);
      limb(g, lp(L.knee, L.foot, .5), L.foot, w - 7, L.col);
      if (!L.kneel) el("ellipse", { cx: L.foot.x - 8, cy: L.foot.y - 2, rx: 15, ry: 6, fill: L.col, stroke: "#0f172a", "stroke-width": 2 }, g);
    };
    leg(P.far, "#b6c0cc", 22);
    const elbG = { x: lerp(P.sh.x, glove.x, .5) - 4, y: lerp(P.sh.y, glove.y, .5) - 6 };
    limb(g, P.sh, elbG, 13, "#1b3456"); limb(g, elbG, glove, 11, "#c99c74");
    const gg = el("g", { transform: `translate(${glove.x} ${glove.y}) rotate(${z4 ? -120 : -80})${z4 ? " scale(-1 1)" : ""}` }, g);
    el("rect", { x: -5, y: -26, width: 10, height: 40, rx: 5, fill: COL.glove, stroke: "#5b3a1a", "stroke-width": 2 }, gg);
    el("rect", { x: -5, y: 6, width: 10, height: 8, rx: 3, fill: "#c08a4e" }, gg);
    // torso + head
    el("path", { d: `M${P.sh.x - 14} ${P.sh.y} L${P.sh.x + 16} ${P.sh.y + 4} L${P.hip.x + 14} ${P.hip.y} L${P.hip.x - 14} ${P.hip.y - 2} Z`, fill: COL.shirt, stroke: "#0b1a30", "stroke-width": 2, "stroke-linejoin": "round" }, g);
    el("circle", { cx: P.head.x, cy: P.head.y, r: 15, fill: COL.skin }, g);
    el("path", { d: `M${P.head.x - 16} ${P.head.y - 2} Q${P.head.x} ${P.head.y - 26} ${P.head.x + 16} ${P.head.y - 2} Z`, fill: COL.cap }, g);
    el("path", { d: `M${P.head.x - 2} ${P.head.y - 5} L${P.head.x - 24} ${P.head.y - 2}`, stroke: COL.cap, "stroke-width": 5, "stroke-linecap": "round" }, g);
    leg(P.near, COL.pants, 24);
    // basket (beside the right knee)
    el("path", { d: `M${SBASKET.x - 24} ${SBASKET.y} L${SBASKET.x + 24} ${SBASKET.y} L${SBASKET.x + 18} 230 L${SBASKET.x - 18} 230 Z`, fill: "rgba(148,163,184,.25)", stroke: "#94a3b8", "stroke-width": 2 }, g);
    for (let i = -1; i <= 1; i++) limb(g, { x: SBASKET.x + i * 13, y: SBASKET.y }, { x: SBASKET.x + i * 10, y: 230 }, 1.2, "#94a3b8");
    // right arm
    limb(g, P.sh, P.elbR, 14, COL.shirt2); limb(g, P.elbR, P.hand, 11, COL.skin);
    el("circle", { cx: P.hand.x, cy: P.hand.y, r: 7, fill: COL.skin, stroke: "#f6c90e", "stroke-width": 3 }, g);
    const lb = (x, y, txt, c, a = "middle") => { const t = el("text", { x, y, fill: c, "font-size": 12.5, "font-weight": 900, "text-anchor": a }, g); t.textContent = txt; };
    const kneelTxt = L => L.kneel ? "（膝をつく）" : "";

    if (!dbl()) { lb(596, 64, "右手は右膝の付近", "#f6c90e", "end"); lb(596, 80, "グラブに近づけない", "#f6c90e", "end"); }
    else { lb(596, 64, "右手はグラブのいちばん近く", "#f6c90e", "end"); lb(596, 80, "土手側で待つ（このドリルだけ）", "#f6c90e", "end"); }
    lb(596, 252, pos === "kneel" ? "両膝つき・パラレル" : "中腰・パラレル", "#cbd5e1", "end");
    lb(SBASKET.x + 26, SBASKET.y + 2, "カゴ", "#cbd5e1", "start");
  }

  // ---------- FRONT VIEW (camera at the tosser: screen-left = player's right) ----------
  const front = $("front");
  el("rect", { x: 0, y: 0, width: 360, height: 340, fill: "#0e1a12" }, front);
  el("rect", { x: 0, y: 262, width: 360, height: 80, fill: "#2a1f14" }, front);
  const fG = el("g", {}, front);
  const fBasket = el("g", {}, front);
  const fBalls = [0, 1].map(() => el("circle", { r: 7, fill: "#fff", stroke: "#64748b", "stroke-width": 2 }, front));
  const FB = { x: 96, top: 262, bot: 300 };                 // basket beside the right knee
  // front poses. legs: { knee, foot, kneel, up }  up: knee raised toward the camera (foreshortened thigh)
  const FK = { hipR: { x: 166, y: 236 }, hipL: { x: 196, y: 236 }, shR: { x: 158, y: 178 }, shL: { x: 204, y: 178 }, head: { x: 181, y: 150 },
              R: { knee: { x: 158, y: 290 }, kneel: true }, L: { knee: { x: 204, y: 290 }, kneel: true } };
  const FC = { hipR: { x: 164, y: 212 }, hipL: { x: 198, y: 212 }, shR: { x: 158, y: 160 }, shL: { x: 204, y: 160 }, head: { x: 181, y: 133 },
              R: { knee: { x: 136, y: 256 }, foot: { x: 146, y: 306 } }, L: { knee: { x: 226, y: 256 }, foot: { x: 216, y: 306 } } };
  const FPOSE = {
    kneel3: { ...FK, hand: { x: 130, y: 262 }, elbR: { x: 122, y: 222 } }, kneel4: { ...FK, hand: { x: 116, y: 250 }, elbR: { x: 120, y: 212 } },
    chu3: { ...FC, hand: { x: 134, y: 248 }, elbR: { x: 116, y: 204 } }, chu4: { ...FC, hand: { x: 118, y: 240 }, elbR: { x: 114, y: 200 } },
  };
  const FZ = {
    3: { G0: { x: 222, y: 270 }, GM: { x: 232, y: 297 }, GF: { x: 246, y: 318 }, GSW: { x: 210, y: 270 }, F1: { x: 236, y: 330 }, F2: { x: 233, y: 301 }, rot: 20 },
    c: { G0: { x: 190, y: 270 }, GM: { x: 181, y: 298 }, GF: { x: 181, y: 320 }, GSW: { x: 188, y: 268 }, F1: { x: 181, y: 330 }, F2: { x: 181, y: 302 }, rot: 0 },
    4: { G0: { x: 172, y: 272 }, GM: { x: 160, y: 299 }, GF: { x: 150, y: 320 }, GSW: { x: 176, y: 270 }, F1: { x: 150, y: 330 }, F2: { x: 159, y: 303 }, rot: 160 },
  };
  const FZk = () => dbl() ? FZ.c : FZ[zone];
  const fPose = () => FPOSE[pos + zone];
  let fGlove = { x: 222, y: 270 };
  const fHand = () => fHandOv ? fHandOv : dbl() ? { x: fGlove.x - 15, y: fGlove.y - 2 } : fPose().hand;
  function drawFront(glove, gScale, gOpen) {
    const g = fG; while (g.firstChild) g.removeChild(g.firstChild);
    fGlove = glove;
    const z4 = zone === 4, P = { ...fPose(), hand: fHand() };
    if (dbl()) P.elbR = { x: lerp(P.shR.x, P.hand.x, .5) - 10, y: lerp(P.shR.y, P.hand.y, .5) + 4 };
    const lb = (x, y, txt, c) => { const t = el("text", { x, y, fill: c, "font-size": 14, "font-weight": 900, "text-anchor": "middle" }, g); t.textContent = txt; };
    const leg = (hip, L, col, name) => {
      if (L.kneel) {
        limb(g, hip, L.knee, 25, COL.pants);
        el("ellipse", { cx: L.knee.x, cy: L.knee.y + 2, rx: 15, ry: 8, fill: col, stroke: "#0f172a", "stroke-width": 2 }, g);
        lb(L.knee.x - (col === COL.R && z4 ? 44 : 0), L.knee.y + 30, name + "膝", col);
        return;
      }
      limb(g, hip, L.knee, L.up ? 30 : 26, COL.pants);
      if (L.up) el("ellipse", { cx: L.knee.x, cy: L.knee.y, rx: 15, ry: 13, fill: COL.pants }, g);
      limb(g, L.knee, L.foot, 19, COL.pants);
      limb(g, lp(L.knee, L.foot, .5), L.foot, 18, col);
      el("ellipse", { cx: L.foot.x, cy: L.foot.y + 5, rx: 16, ry: 9, fill: col, stroke: "#0f172a", "stroke-width": 2 }, g);
      lb(L.foot.x - (col === COL.R && z4 ? 40 : 0), L.foot.y + 30, name, col);
    };
    // farther (higher on screen) leg first
    const legs = [[P.hipR, P.R, COL.R, "右"], [P.hipL, P.L, COL.L, "左"]].sort((a, b) => (a[1].foot || a[1].knee).y - (b[1].foot || b[1].knee).y);
    legs.forEach(l => leg(...l));
    // torso
    el("path", { d: `M${P.shR.x} ${P.shR.y} L${P.shL.x} ${P.shL.y} L${P.hipL.x + 3} ${P.hipL.y} L${P.hipR.x - 3} ${P.hipR.y} Z`, fill: COL.shirt, stroke: "#0b1a30", "stroke-width": 2, "stroke-linejoin": "round" }, g);
    limb(g, { x: P.hipR.x - 3, y: P.hipR.y - 3 }, { x: P.hipL.x + 3, y: P.hipL.y - 3 }, 6, "#0f172a", "butt");
    el("circle", { cx: P.head.x, cy: P.head.y, r: 16, fill: COL.skin }, g);
    el("path", { d: `M${P.head.x - 17} ${P.head.y - 3} Q${P.head.x} ${P.head.y - 27} ${P.head.x + 17} ${P.head.y - 3} Z`, fill: COL.cap }, g);
    el("path", { d: `M${P.head.x - 16} ${P.head.y - 4} Q${P.head.x} ${P.head.y + 4} ${P.head.x + 16} ${P.head.y - 4}`, stroke: COL.cap, "stroke-width": 5, fill: "none" }, g);
    // right arm
    limb(g, P.shR, P.elbR, 15, COL.shirt2); limb(g, P.elbR, P.hand, 12, COL.skin);
    el("circle", { cx: P.hand.x, cy: P.hand.y, r: 8, fill: COL.skin, stroke: "#f6c90e", "stroke-width": 3 }, g);
    // glove arm
    const elbL = z4 ? { x: glove.x + 34, y: glove.y - 52 } : { x: lerp(P.shL.x, glove.x, .5) + 16, y: lerp(P.shL.y, glove.y, .45) };   // backhand: elbow up, forearm across the body
    limb(g, P.shL, elbL, 15, COL.shirt2); limb(g, elbL, glove, 12, COL.skin);
    const gg = el("g", { transform: `translate(${glove.x} ${glove.y}) rotate(${FZk().rot}) scale(${z4 ? -gScale : gScale} ${gScale})` }, g);
    el("path", { d: "M-17 -4 Q-18 -26 0 -28 Q18 -26 17 -4 Q15 14 0 16 Q-15 14 -17 -4 Z", fill: COL.glove, stroke: "#5b3a1a", "stroke-width": 2 }, gg);
    el("path", { d: "M-12 -6 Q-12 -20 0 -21 Q12 -20 12 -6 Q11 4 0 5 Q-11 4 -12 -6 Z", fill: "#a8743f" }, gg);
    el("path", { d: "M-13 9 Q0 17 13 9 L12 14 Q0 21 -12 14 Z", fill: "#c08a4e" }, gg);
    { const t = el("text", { x: 332, y: 140, fill: "#fbbf24", "font-size": 15, "font-weight": 900, "text-anchor": "end" }, g); t.textContent = dbl() ? "ダブル" : z4 ? "逆シングル" : "シングル"; }
    if (z4) {

    }
  }
  function drawBasket(nIn) {
    const g = fBasket; while (g.firstChild) g.removeChild(g.firstChild);
    el("path", { d: `M${FB.x - 30} ${FB.top} L${FB.x + 30} ${FB.top} L${FB.x + 24} ${FB.bot} L${FB.x - 24} ${FB.bot} Z`, fill: "rgba(148,163,184,.22)", stroke: "#94a3b8", "stroke-width": 2 }, g);
    for (let i = -2; i <= 2; i++) limb(g, { x: FB.x + i * 12, y: FB.top }, { x: FB.x + i * 9.6, y: FB.bot }, 1.2, "#94a3b8");
    limb(g, { x: FB.x - 27, y: FB.top + 19 }, { x: FB.x + 27, y: FB.top + 19 }, 1.2, "#94a3b8");
    for (let i = 0; i < nIn; i++) {
      const row = Math.floor(i / 4), col = i % 4;
      el("circle", { cx: FB.x - 15 + col * 10 + (row % 2) * 5, cy: FB.bot - 7 - row * 8, r: 5, fill: "#fff", stroke: "#64748b", "stroke-width": 1.2 }, g);
    }
    const t = el("text", { x: zone === 4 ? FB.x - 52 : FB.x, y: zone === 4 ? FB.top + 26 : FB.bot + 22, fill: "#cbd5e1", "font-size": 13, "font-weight": 800, "text-anchor": "middle" }, g); t.textContent = "カゴ";
  }

  // ---------- counter ----------
  const dots = $("dots");
  for (let i = 0; i < N; i++) dots.appendChild(document.createElement("i"));

  // ---------- state ----------
  let speed = 1, playing = true, gt = 0, last = null;
  // advanced: the next toss is released when the previous ball drops into the basket
  const gap = () => level === "beg" ? dur(0) : dur(0) * (U.drop - U.rel);
  const calcTotal = () => (N - 1) * gap() + dur(0) + FINISH;
  let total = calcTotal();
  const active = t => { const out = []; for (let n = 0; n < N; n++) { const u = (t - n * gap()) / dur(n); if (u >= 0 && u < 1) out.push({ n, u }); } return out; };

  function render() {
    const act = active(gt);
    const done = act.length === 0;
    const newest = done ? null : act[act.length - 1], oldest = done ? null : act[0];
    let inBasket = 0; for (let n = 0; n < N; n++) if ((gt - n * gap()) / dur(n) >= U.drop) inBasket++;
    const u = oldest ? oldest.u : 0;                 // the glove follows the ball being caught
    // ---- side view
    drawTosser(newest ? newest.u : 0);
    let sg;
    const SH = { x: 460, y: 216 }, SF = { x: 408, y: 214 }, SSW = { x: 448, y: 206 };   // home / reached out / switch point (away from the right hand)
    if (done) sg = SH;
    else if (gl === "push") { sg = u < .52 ? SH : u < U.meet ? lp(SH, SM, ease(seg(u, .52, U.meet))) : null; }
    else { sg = u < .40 ? SH : u < .56 ? lp(SH, SF, ease(seg(u, .40, .56))) : u < U.meet ? lp(SF, SM, ease(seg(u, .56, U.meet))) : null; }
    if (!sg) sg = u < U.sw1 ? arc(SM, SSW, 6, ease(seg(u, U.meet, U.sw0))) : lp(SSW, SH, ease(seg(u, U.sw1, 1)));
    sHandOv = null;
    if (dbl() && !done && u >= U.sw1) { const near = { x: sg.x + 9, y: sg.y - 6 }, bk = { x: SBASKET.x, y: SBASKET.y - 8 };
      sHandOv = u < U.drop ? lp(near, bk, ease(seg(u, U.sw1, U.drop))) : lp(bk, near, ease(seg(u, U.drop, 1))); }
    drawPlayerSide(sg, u < U.meet ? 1 : .3);
    let spinAt = null;
    sBalls.forEach((b, i) => {
      const T = act[i]; let sb = null;
      if (T) { const v = T.u;
        if (v < U.rel) sb = null;
        else if (v < U.b1) sb = arc(R0, B1, 4, seg(v, U.rel, U.b1));
        else if (v < U.b2) { sb = arc(B1, B2, 26, seg(v, U.b1, U.b2)); spinAt = sb; }
        else if (v < U.meet) sb = arc(B2, SM, 2, seg(v, U.b2, U.meet));
        else if (dbl() && v < U.sw1) { const heel = { x: sg.x + 5, y: sg.y - 3 }; sb = v < U.sw0 ? lp(sg, heel, ease(seg(v, U.meet, U.sw0))) : lp(heel, sHand(), ease(seg(v, U.sw0, U.sw1))); }
        else if (v < U.sw0) sb = { ...sg };
        else if (v < U.sw1) sb = arc(sg, sHand(), 26, ease(seg(v, U.sw0, U.sw1)));
        else if (dbl() && v < U.drop) sb = { ...sHand() };
        else if (v < U.drop) sb = arc(sHand(), { x: SBASKET.x, y: 214 }, 6, seg(v, U.sw1, U.drop));
      }
      b.setAttribute("opacity", sb ? 1 : 0);
      if (sb) b.setAttribute("transform", `translate(${sb.x} ${sb.y - 1}) rotate(${(gt * 900) % 360})`);
    });
    sSpin.setAttribute("opacity", spinAt ? 1 : 0);
    if (spinAt) sSpin.setAttribute("transform", `translate(${spinAt.x} ${spinAt.y - 10})`);
    // ---- front view
    let fg, gs;
    const { G0, GM, GF, GSW } = FZk();
    if (done || u < (gl === "push" ? .52 : .40)) { fg = G0; gs = 1; }
    else if (gl === "push" && u < U.meet) { const k = ease(seg(u, .52, U.meet)); fg = lp(G0, GM, k); gs = lerp(1, 1.18, k); }
    else if (gl === "pull" && u < .56) { const k = ease(seg(u, .40, .56)); fg = lp(G0, GF, k); gs = lerp(1, 1.35, k); }
    else if (gl === "pull" && u < U.meet) { const k = ease(seg(u, .56, U.meet)); fg = lp(GF, GM, k); gs = lerp(1.35, 1.18, k); }
    else if (u < U.sw1) { const k = ease(seg(u, U.meet, U.sw0)); fg = arc(GM, GSW, 8, k); gs = lerp(1.18, 1, k); }
    else { fg = lp(GSW, G0, ease(seg(u, U.sw1, 1))); gs = 1; }
    fHandOv = null;
    if (dbl() && !done && u >= U.sw1) { const near = { x: fg.x - 15, y: fg.y - 2 }, bk = { x: FB.x + 6, y: FB.top - 8 };
      fHandOv = u < U.drop ? lp(near, bk, ease(seg(u, U.sw1, U.drop))) : lp(bk, near, ease(seg(u, U.drop, 1))); }
    drawFront(fg, gs, u < U.meet ? 1 : .3);
    drawBasket(inBasket);
    fBalls.forEach((b, i) => {
      const T = act[i]; let fb = null, fr = 7;
      if (T && T.u >= U.rel) { const v = T.u;
        const { F1, F2 } = FZk(), A = { x: F1.x - 4, y: 336 };
        if (v < U.b1) { fb = lp(A, F1, seg(v, U.rel, U.b1)); fr = 13; }
        else if (v < U.b2) { const k = seg(v, U.b1, U.b2); fb = arc(F1, F2, 16, k); fr = lerp(12.5, 7.5, k); }
        else if (v < U.meet) { const k = seg(v, U.b2, U.meet); fb = arc(F2, GM, 2, k); fr = lerp(7.5, 7, k); }
        else if (dbl() && v < U.sw1) { const heel = { x: fg.x - 8, y: fg.y - 1 }; fb = v < U.sw0 ? lp(fg, heel, ease(seg(v, U.meet, U.sw0))) : lp(heel, fHand(), ease(seg(v, U.sw0, U.sw1))); }
        else if (v < U.sw0) fb = { ...fg };
        else if (v < U.sw1) fb = arc(fg, fHand(), 34, ease(seg(v, U.sw0, U.sw1)));
        else if (dbl() && v < U.drop) fb = { ...fHand() };
        else if (v < U.drop) fb = arc(fHand(), { x: FB.x + 4, y: FB.bot - 10 }, 8, seg(v, U.sw1, U.drop));
      }
      b.setAttribute("opacity", fb ? 1 : 0);
      if (fb) { b.setAttribute("cx", fb.x); b.setAttribute("cy", fb.y); b.setAttribute("r", fr); }
    });
    // ---- counter + caption
    const cur = newest ? newest.n : N;
    dots.querySelectorAll("i").forEach((d, i) => { d.className = i < inBasket ? "done" : (i === cur && !done ? "now" : ""); });
    $("cnt").textContent = done ? "10球 完了" : `${cur + 1} / ${N}球`;
    $("tempoTxt").textContent = level === "beg" ? "ゆっくり｜初心者" : "速い｜上級者（カゴに入るころには次のトス）";
    let cap;
    const st = oldest && oldest.u >= U.b2 ? oldest : newest;   // describe the ball being caught first
    const v = st ? st.u : 0;
    if (done) cap = level === "beg" ? "10球連続で1セット。初心者は、10球ともゆっくり" : "10球連続で1セット。上級者は、カゴに入るころには次のボールが投げられている";
    else if (level === "adv" && act.length > 1 && oldest.u >= U.sw1) cap = "カゴに入るころには、次のボールが投げられている";
    else if (v < U.rel) cap = st.n === 0 ? "スタート：" + (pos === "kneel" ? "両膝をつき、両足パラレル。" : "中腰、両足パラレル（膝はつかない）。") + (dbl() ? "右手はグラブのいちばん近く、土手側に置く（このドリルだけ）" : "右手は右膝の付近。グラブに近づけない") : "トサーが正面からアンダートス";
    else if (v < U.b1) cap = "1バウンド目は、トサーのすぐ横";
    else if (v < U.b2) cap = "2バウンド目が" + (dbl() ? "両足の真ん中" : zone === 3 ? "フォア側" : "バック側") + "に来るように。低く2バウンド。トップスピンのゴロになる";
    else if (v < U.meet) cap = (dbl() ? "ダブル・" : zone === 4 ? "逆シングル・" : "シングル・") + (gl === "push" ? "push：2バウンド目のすぐ後を、板グラブを出しながらさばく" : "pull：2バウンド目のすぐ後を、板グラブを引きながらさばく");
    else if (v < U.sw1) cap = dbl() ? "ヒッティングスイッチ：グラブに当てたボールが、グラブの中を転がって土手側から出てくる。そこで待つ右手が受け取る" : "スローイングスイッチ：板グラブで止めずに、右手へ空中で投げ渡す";
    else cap = dbl() ? "右手を動かして、カゴへ入れる。右手はまたグラブのいちばん近くへ。これで1回" : "右手からカゴへドロップ。これで1回";
    $("capTxt").textContent = cap;
  }

  function frame(ts) {
    if (!playing) { last = null; return; }
    if (last != null) gt += (ts - last) / 1000 * speed;
    last = ts; if (gt > total) gt = 0;
    render(); requestAnimationFrame(frame);
  }
  const play = () => { if (playing) return; playing = true; $("btnPlay").textContent = "❚❚ 一時停止"; requestAnimationFrame(frame); };
  const pause = () => { playing = false; $("btnPlay").textContent = "▶ 再生"; };
  $("btnPlay").onclick = () => playing ? pause() : play();
  $("btnRestart").onclick = () => { gt = 0; render(); play(); };
  const setInfo = () => {
    const z3 = zone === 3;
    $("iAim").innerHTML = dbl() ? "両足の真ん中でダブル<br>ヒッティングスイッチ" : z3 ? "ゾーン3のシングルと<br>スローイングスイッチ" : "ゾーン4の逆シングルと<br>スローイングスイッチ";
    const k = pos === "kneel";
    $("iForm").innerHTML = (k ? "両膝つき・パラレル。" : "中腰・パラレル。") + (dbl() ? "右手は<br>グラブのいちばん近く（土手側）" : "右手は右膝の付近。<br>グラブに近づけない");
    $("iBall").innerHTML = "正面からアンダートス<br>2バウンド目が" + (dbl() ? "両足の真ん中" : z3 ? "フォア側" : "バック側");
    b2Sub.textContent = dbl() ? "両足の真ん中へ" : z3 ? "フォア側へ" : "バック側へ";
    document.querySelectorAll("[data-md]").forEach(b => b.classList.toggle("on", b.dataset.md === md));
    document.querySelectorAll("[data-pos]").forEach(b => b.classList.toggle("on", b.dataset.pos === pos));
  };
  document.querySelectorAll("[data-md]").forEach(b => b.onclick = () => { md = b.dataset.md; zone = md === "s4" ? 4 : 3; setInfo(); gt = 0; render(); play(); });
  document.querySelectorAll("[data-pos]").forEach(b => b.onclick = () => { pos = b.dataset.pos; setInfo(); gt = 0; render(); play(); });
  document.querySelectorAll("[data-gl]").forEach(b => b.onclick = () => { document.querySelectorAll("[data-gl]").forEach(x => x.classList.remove("on")); b.classList.add("on"); gl = b.dataset.gl; gt = 0; render(); play(); });
  document.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { document.querySelectorAll("[data-lv]").forEach(x => x.classList.remove("on")); b.classList.add("on"); level = b.dataset.lv; gt = 0; total = calcTotal(); render(); play(); });
  document.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => { document.querySelectorAll("[data-sp]").forEach(x => x.classList.remove("on")); b.classList.add("on"); speed = +b.dataset.sp; play(); });

  window.__setT = v => { pause(); gt = v; render(); };
  window.__opt = o => { if (o.pos) pos = o.pos; if (o.md) { md = o.md; zone = md === "s4" ? 4 : 3; } setInfo(); if (o.gl) gl = o.gl; if (o.lv) { level = o.lv; total = calcTotal(); } };
  window.__setU = (n, u) => { pause(); gt = n * gap() + u * dur(n); render(); };
  setInfo(); render(); requestAnimationFrame(frame);
})();
</script>
<script>
(() => {
  const inFrame = window.self !== window.top;
  if (inFrame) document.documentElement.classList.add("embed");
  const post = () => { if (inFrame) parent.postMessage({ type: "anim-height", h: document.documentElement.scrollHeight }, "*"); };
  window.addEventListener("load", post); window.addEventListener("resize", post);
  if (window.ResizeObserver) new ResizeObserver(post).observe(document.body);
  setTimeout(post, 300);
})();
</script>
<script>
(() => { const q = new URLSearchParams(location.search);
  if (q.has("shot")) document.documentElement.classList.add("shot");
  if (q.has("pos") && !q.has("u")) setTimeout(() => __opt({ pos: q.get("pos") }), 30);
  if (q.has("u")) setTimeout(() => { __opt({ gl: q.get("gl"), lv: q.get("lv"), md: q.get("md"), pos: q.get("pos") }); __setU(+(q.get("n") || 0), +q.get("u")); }, 50);
})();
</script>
